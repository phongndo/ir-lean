name = "ir-lean"
version = "0.1.0"
defaultTargets = ["IRLean"]

[[lean_lib]]
name = "IRLean"
# The tests run emitted code against this, natively. Interpreting it is about 10 times slower.
defaultFacets = ["leanArts", "shared"]

# The proofs, and the generated modules they import, from `tests/proofs.sh build/ir-lean --generate
# build/generated`. These are for `lake build Proofs` and the language server. tests/proofs.sh checks
# the proofs against freshly generated modules instead.
[[lean_lib]]
name = "Generated"
srcDir = "build/generated"
roots = ["Real", "Zlib", "Crc"]

[[lean_lib]]
name = "Proofs"
srcDir = "tests/proofs"
roots = ["Adler32", "Crc32", "CrcSpec", "CrcTables", "Popcount"]
