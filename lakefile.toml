name = "ir-lean"
version = "0.1.0"
license = "Apache-2.0"
defaultTargets = ["IRLean", "LemmaStore", "StoreTool", "Peephole"]

[[lean_lib]]
name = "IRLean"
# The tests run emitted code against this, natively. Interpreting it is about 10 times slower.
defaultFacets = ["leanArts", "shared"]

# The lemma store: lemmas later proofs can find and reuse, the counterexamples that show each hypothesis is needed,
# and the selector that finds them. docs/lemma-store.md.
[[lean_lib]]
name = "LemmaStore"
srcDir = "store"
roots = ["LemmaStore", "LemmaStore.Counter", "LemmaStore.Select"]

# The store's checker and lookup, which tools/store/store.py runs.
[[lean_lib]]
name = "StoreTool"
srcDir = "tools/store"

# The proofs, and the generated modules they import, from `tests/proofs.sh build/ir-lean --generate
# build/generated`. These are for `lake build Proofs` and the language server. tests/proofs.sh checks
# the proofs against freshly generated modules instead.
[[lean_lib]]
name = "Generated"
srcDir = "build/generated"
roots = ["Real", "Zlib", "Crc", "Inflate", "LlamaBitspreadIR"]

[[lean_lib]]
name = "Proofs"
srcDir = "tests/proofs"
roots = [
  "Adler32",
  "Crc32",
  "CrcSpec",
  "CrcTables",
  "LlamaBitspread",
  "MemoryModel",
  "Popcount",
  "UpdateWindow",
]

# Chunk 1's G2: models of the folds in InstSimplify, InstCombine, AggressiveInstCombine and Reassociate, each
# rewrite proved for every input, by the IDs tests/llvm_scope/rewrites gives them. Each Lean process is capped at
# 4 GB: a proof that needs more is missing a lemma. A default target, so CI's setup checks every proof.
# docs/rewrite-proofs.md.
[[lean_lib]]
name = "Peephole"
srcDir = "tests/passes-proofs/peephole"
globs = ["Peephole.+"]
moreLeanArgs = ["-M", "4096"]
