# Decision 7 of 2026-11-10: its Argon2id test in benchmark mode, and a bulk-encryption driver of ours.
[[project.libsodium.workload]]
name = "argon2id"
what = "Hashing passwords with Argon2id: libsodium's test of it, 200 times over"
benchmark = "test/default/pwhash_argon2id built with -DBENCHMARKS, libsodium's own, as bench/kernels/profile.sh builds it"
# Built in benchmark mode, a test runs its body ITERATIONS times and prints the time: test/default/cmptest.h. Its
# check builds the same test again in checking mode, in the same place, so what's timed is a copy of the program,
# out of the tests' directory, which the check cleans: in whichever order the two are run, the check can't
# replace what's timed. The copy is the program libtool's wrapper script runs, and it runs with the library path
# the wrapper sets, the build's own libsodium.
build = [
  [
    "make",
    "-C",
    "{build}/test/default",
    "clean",
  ],
  [
    "make",
    "-C",
    "{build}/test/default",
    "CPPFLAGS=-DBENCHMARKS -DITERATIONS=200",
    "pwhash_argon2id",
  ],
  [
    "cp",
    "{build}/test/default/.libs/pwhash_argon2id",
    "{build}/pwhash_argon2id-benchmark",
  ],
]
run = [
  [
    "env",
    "LD_LIBRARY_PATH={build}/src/libsodium/.libs",
    "{build}/pwhash_argon2id-benchmark",
  ],
]
measure = "time"

# A test built in benchmark mode prints only times, and make check passes it whatever it computes, so the tests
# are cleaned first, and built again in checking mode. That leaves the workload's own copy alone.
[[project.libsodium.workload.check]]
kind = "known-answers"
what = "The same test in its checking mode, which writes what it computes for its test vectors and compares it with its .exp file"
test = ["test/default/pwhash_argon2id.c", "test/default/pwhash_argon2id.exp"]
run = [
  [
    "make",
    "-C",
    "{build}/test/default",
    "clean",
  ],
  [
    "make",
    "-C",
    "{build}/test/default",
    "check",
    "TESTS=pwhash_argon2id",
    "check_PROGRAMS=pwhash_argon2id",
  ],
]

[[project.libsodium.workload]]
name = "secretstream"
what = "Encrypting a gibibyte with XChaCha20-Poly1305 in 4096-byte chunks, pulling each chunk back, and hashing what was encrypted with BLAKE2b"
