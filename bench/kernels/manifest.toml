# The kernel corpus: the fixed list of real projects the superoptimizer is judged on. docs/kernels.md.
# It isn't docs/corpus.md's corpus, the pairs of IR tools/corpus/capture.py takes from `opt`.
#
# While `state` is "proposed" this is a proposal, and nothing here is approved. To approve a list, the
# maintainer names the projects in `approved`, sets `state` to "fixed", and adds a [lock] with the digest
# `bench/kernels/kernels.py digest NAME...` prints. After that, tests/kernels_test.py fails on any change to an
# approved project, or to what the corpus compiles with, that no [[amendment]] records with its reason.

schema = "ir-lean.kernels.manifest/1"

[corpus]
state = "proposed"
approved = []
# The compiler the baseline is built with: tests/llvm/targets.toml's pin.
llvm_tag = "llvmorg-23.1.3"
target = "x86_64-unknown-linux-gnu"
# Decision 6's baseline. A project that builds at a lower level is compiled at this one.
opt = "-O3"
# What the dev shell's compiler wrapper adds and stock clang doesn't, undone, as tests/llama.py does.
flags = ["-fomit-frame-pointer", "-momit-leaf-frame-pointer"]
machine = "z: AMD Ryzen 9 9950X, znver5, AVX-512 with VNNI, 32 threads, 30 GB"

