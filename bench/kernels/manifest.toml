[project.flac]
what = "The reference FLAC lossless audio encoder and decoder"
users = "It's the FLAC reference implementation, which distributions ship as flac and libFLAC"
domain = "codecs"
status = "recommended"
repository = "https://github.com/xiph/flac"
tag = "1.5.0"
rev = "1507800de4b70e21be71f38caa0d9079d0bc6e45"
nix_hash = "sha256-B6XRai5UOAtY/7JXNbI3YuBgazi1Xd2ZOs6vvLq9LIs="
license = "BSD-3-Clause"
simd = "intrinsics"
project_opt = "-O3"
configure = [
  "cmake",
  "-S",
  "{src}",
  "-B",
  "{build}",
  "-G",
  "Ninja",
  "-DCMAKE_BUILD_TYPE=Release",
  "-DWITH_OGG=OFF",
  "-DBUILD_TESTING=OFF",
  "-DBUILD_EXAMPLES=OFF",
  "-DBUILD_DOCS=OFF",
  "-DINSTALL_MANPAGES=OFF",
  "-DBUILD_CXXLIBS=OFF",
]
# Its CMake's flags for a Release build, read from compile_commands.json on 2026-11-10. It names no -m flags:
# each SIMD function carries a target attribute.
flags = [
  "-DFLAC__NO_DLL",
  "-DHAVE_CONFIG_H",
  "-D_DARWIN_C_SOURCE",
  "-D_FORTIFY_SOURCE=2",
  "-D_POSIX_PTHREAD_SEMANTICS",
  "-D_TANDEM_SOURCE",
  "-D__STDC_WANT_IEC_60559_BFP_EXT__",
  "-D__STDC_WANT_IEC_60559_DFP_EXT__",
  "-D__STDC_WANT_IEC_60559_FUNCS_EXT__",
  "-D__STDC_WANT_IEC_60559_TYPES_EXT__",
  "-D__STDC_WANT_LIB_EXT2__",
  "-D__STDC_WANT_MATH_SPEC_FUNCS__",
  "-DNDEBUG",
  "-fassociative-math",
  "-fno-signed-zeros",
  "-fno-trapping-math",
  "-freciprocal-math",
  "-fstack-protector-strong",
]
include = ["{src}/include", "{build}", "{src}/src/libFLAC/include"]
# Not how FLAC is built: bench/kernels/demand.py's relaxed run drops three of its fast-math flags, which put an
# attribute on every function that the emitter refuses, to say what stops its kernels after that. It keeps
# -fno-trapping-math, clang's default: -ftrapping-math would make every function strictfp.
relax = ["-fsigned-zeros", "-fno-associative-math", "-fno-reciprocal-math"]

