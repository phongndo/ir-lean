source = "ggml/src/ggml-cpu/arch/x86/repack.cpp"
flags = ["-std=gnu++17"]
kernels = ["ggml_gemm_q4_K_8x8_q8_K", "ggml_gemv_q4_K_8x8_q8_K"]

[[project."llama.cpp".unit]]
