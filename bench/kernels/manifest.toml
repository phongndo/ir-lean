license = "MIT"
simd = "intrinsics"
project_opt = "-O3"
# What llama.cpp's CMake passes in a Release build with GGML_NATIVE, its default, as tests/llama.py records.
# -march=native on z is znver5, and naming it makes the IR the same on any host.
flags = [
  "-DGGML_BACKEND_BUILD",
  "-DGGML_BACKEND_SHARED",
  "-DGGML_SCHED_MAX_COPIES=4",
  "-DGGML_SHARED",
  "-DGGML_USE_CPU_REPACK",
  "-DGGML_USE_LLAMAFILE",
  "-D_GNU_SOURCE",
  "-D_XOPEN_SOURCE=600",
