# The kernel corpus: the fixed list of real projects the superoptimizer is judged on. docs/kernels.md.
# It isn't docs/corpus.md's corpus, the pairs of IR tools/corpus/capture.py takes from `opt`.
#
# It was proposed, the maintainer approved the six recommended projects on 2026-11-10, with the seven decisions
# docs/roadmap.md records, and it was fixed the same day, once decision 7's bulk-encryption driver for libsodium
# was written: `state` is "fixed", and [lock] holds the digest `bench/kernels/kernels.py digest` prints, which
# docs/roadmap.md's record of the decision and tests/kernels_test.py both hold too, so the lock can't be replaced
# without changing them. Since then tests/kernels_test.py fails on any change to an approved project, or to what
# the corpus compiles with, that no [[amendment]] records with its date and reason, starting from the lock.
#
# A project's workloads are what wall time is measured on, by docs/kernels.md's protocol. Their commands name
# {src}, the source at its pin, {build}, the project's build, {out}, a directory for what a run writes, {repo},
# this repository, and {input:NAME}, one of the project's inputs, as `bench/kernels/kernels.py inputs` fetches
# it. {input:NAME}/FILE is a file made from that archive: a member of a zip, or for silesia.zip, silesia.tar,
# the tar of its members that `inputs` makes beside it.
#
# `run` is what's timed. `setup` runs once before the timed runs, on the same build, and `build` makes what the
# project's own build doesn't. `measure` is "time", the wall time of `run`, or "rate", a speed the benchmark
# prints, which `rate` names, where it runs for a fixed time or times its own repetitions. Each [[check]] is how
# a candidate is shown to compute what the baseline does before it's timed: "output", what the run writes,
# hashed and compared bit for bit with the baseline's, or "known-answers", the project's own test of the same
# functions in its checking mode. Every file of this repository a workload or a check runs, {repo}/PATH, is its
# `driver`, pinned by `driver_sha256`, or in a `pinned` table of its path and SHA-256, so the lock covers it.

schema = "ir-lean.kernels.manifest/2"

[corpus]
state = "fixed"
approved = ["llama.cpp", "zlib-ng", "xxhash", "libsodium", "flac", "libwebp"]
approved_on = "2026-11-10"
decided_in = "docs/roadmap.md#the-kernel-corpus-decided-on-2026-11-10"
# The compiler the baseline is built with: tests/llvm/targets.toml's pin, by its tag, and by the commit and source
# hash under the tag, which could move while the tag doesn't.
llvm_tag = "llvmorg-23.1.3"
llvm_commit = "0d261d1ca552c95a8f007e061c787ac7132fbcbc"
llvm_nix_hash = "sha256-+e5YvYEbCvvEQbLVIQP5hwPp4tEk6EB270bSEMKv0t4="
target = "x86_64-unknown-linux-gnu"
# Decision 6's baseline. A project that builds at a lower level is compiled at this one.
opt = "-O3"
# What the dev shell's compiler wrapper adds and stock clang doesn't, undone, as tests/llama.py does.
flags = ["-fomit-frame-pointer", "-momit-leaf-frame-pointer"]
machine = "z: AMD Ryzen 9 9950X, znver5, AVX-512 with VNNI, 32 threads, 30 GB"

# Fixed on 2026-11-10: the digest of [corpus]'s settings and the six projects' entries, as approved.
[lock]
sha256 = "d58e280b3e19bf21a75927a9ca408a695f4a52fb8bdfdfc97db3d8c685be45eb"
approved_on = "2026-11-10"
approved_in = "docs/roadmap.md#the-kernel-corpus-decided-on-2026-11-10"

