# The three workloads tests/llama_bench.py times, each with 8 threads, as it runs them.
[[project."llama.cpp".workload]]
name = "pp512"
what = "Reading a 512-token prompt with a Q4_K_M model"
benchmark = "llama-bench, llama.cpp's own, as tests/llama_bench.py runs it"
threads = 8
run = [
  [
    "{build}/bin/llama-bench",
    "-m",
    "{input:qwen2.5-1.5b-instruct-q4_k_m.gguf}",
    "-t",
    "8",
    "-p",
    "512",
    "-n",
    "0",
    "-r",
    "3",
    "-o",
    "csv",
  ],
]
measure = "rate"
rate = "Tokens a second: avg_ts, in the last row of the CSV llama-bench prints"

# llama.cpp has no test that compares these kernels with known answers: tests/test-quantize-fns.cpp compares
# them with a float reference within an error bound, and test-backend-ops compares one backend with another. So
# each workload is checked by the raw logits of a run of its own: tests/llama's capture, a private copy of
# llama.cpp's own completion driver, built against {build}, that writes the FP32 logits it samples from at every
# step, before sampling touches them. The prompt's 98 tokens are read as one batch, by the matrix-matrix kernels
# pp512 times, and each of the 127 tokens after the first is one step of decoding, by the matrix-vector kernels
# tg128 times. Greedy, with the end of text ignored, so it's 128 steps every time, with tg128's 8 threads, since
# another count can round differently. It needs {build} to be tests/llama_bench.py's build, which writes
# compile_commands.json. The files of ours it runs are pinned by their hashes.
[[project."llama.cpp".workload.check]]
kind = "output"
what = "The raw FP32 logits greedy decoding samples from at each of 128 steps, with the prompt's tokens, each token chosen and its position, from tests/llama's capture, as docs/llama-q5.md compared them: bit for bit with the baseline's"
run = [
  [
    "python3",
    "{repo}/tests/llama/build_capture.py",
    "--source-dir",
    "{src}",
    "--build-dir",
    "{build}",
    "--output-dir",
    "{out}/capture",
  ],
  [
    "env",
    "LLAMA_EXACT_OUTPUT_PREFIX={out}/decode",
    "{out}/capture/llama-completion-exact",
    "-m",
    "{input:qwen2.5-1.5b-instruct-q4_k_m.gguf}",
    "-t",
    "8",
    "-tb",
    "8",
    "-c",
    "4096",
    "-b",
    "512",
    "-ub",
    "512",
    "-n",
    "128",
    "--seed",
    "1234",
    "--temp",
    "0",
    "--ignore-eos",
    "--no-conversation",
    "--simple-io",
    "--no-display-prompt",
    "-f",
    "{repo}/tests/llama/prompt.txt",
  ],
]
output = [
  "{out}/decode.prompt.i32",
  "{out}/decode.logits.f32",
  "{out}/decode.tokens.i32",
  "{out}/decode.positions.i32",
  "{out}/decode.json",
]

