name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: Formatters, linters and language servers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        id: setup
      - run: nix develop -c ctest --test-dir build -L lint --output-on-failure
      # Every job restores the cache, and only this one saves it, so jobs don't race for the key. It finishes
      # first, and has used all of it: the toolchain, the library built at this commit, and uv's packages for
      # the linters as well as the tests.
      - name: Save caches
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup.outputs.cache-paths }}
          key: ${{ steps.setup.outputs.cache-key }}
      - name: Save alive2
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.setup.outputs.alive2-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ir-lean-alive2
          key: ${{ steps.setup.outputs.alive2-key }}
  # Whether a pull request needs the tests: not when it only adds or edits Markdown that no file but Markdown
  # names, which is how a test would read it. .github/needs-tests.py says why either way. Pushes and manual
  # runs always need them. Lint runs whatever this says.
  changes:
    name: Which jobs the change needs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.decide.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
      - id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --quiet --depth=1 --no-tags origin "$BASE"
            .github/needs-tests.py "$BASE" HEAD >>"$GITHUB_OUTPUT"
          else
            echo tests=true >>"$GITHUB_OUTPUT"
          fi
  test:
    name: Tests and proofs (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A job for each of these ctest labels, set in CMakeLists.txt, runs the tests with it, so the longest
        # tests don't wait for each other. `rest` runs every other test the `lint` and `slow` jobs don't, so a
        # test with no label still runs, and first checks that CI runs each test exactly once.
        shard: &labels [passes, binding, llvm, semantics, llama]
        include:
          - shard: rest
            labels: *labels
          # Only this shell has llama.cpp's source, which the llama tests need, and every other job does without.
          - shard: llama
            shell: .#llama
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          shell: ${{ matrix.shell }}
      - run: nix develop ${{ matrix.shell }} -c .github/test-shard.sh ${{ matrix.shard }} ${{ join(matrix.labels, ' ') }}
  slow:
    name: Slow zlib tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: nix develop -c ctest --test-dir build -L slow --output-on-failure
