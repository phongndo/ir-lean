name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: Formatters, linters and language servers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: nix develop -c ctest --test-dir build -L lint --output-on-failure
  test:
    name: Tests and proofs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: nix develop -c ctest --test-dir build -LE 'lint|slow|llama' --output-on-failure
  # Its own job, alongside the others, since only its shell has llama.cpp's source. It needs no model, and
  # measures nothing: tests/llama_bench.py does that, and CI doesn't run it.
  llama:
    name: llama.cpp's q4_K rewrite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: nix develop .#llama -c ctest --test-dir build -L llama --output-on-failure
  slow:
    name: Slow zlib tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: nix develop -c ctest --test-dir build -L slow --output-on-failure
