# What tests/llvm.py proves, from unmodified source in the monorepo at `tag`. See docs/llvm.md.

support = ["Kit", "Bits", "Div", "Words"]

[project]
repository = "https://github.com/llvm/llvm-project"
tag = "llvmorg-23.1.3"
commit = "0d261d1ca552c95a8f007e061c787ac7132fbcbc"
nix_hash = "sha256-+e5YvYEbCvvEQbLVIQP5hwPp4tEk6EB270bSEMKv0t4="

# compiler-rt/lib/builtins/CMakeLists.txt's BUILTIN_CFLAGS and BUILTIN_DEFS, with CMake's -O3 -DNDEBUG for a Release build.
[flags.compiler_rt]
args = [
  "-O3",
  "-DNDEBUG",
  "-std=c11",
  "-fPIC",
  "-fno-builtin",
  "-fvisibility=hidden",
  "-DVISIBILITY_HIDDEN",
  "-fomit-frame-pointer",
]
include = ["compiler-rt/lib/builtins"]

# libc/cmake/modules/LLVMLibCCompileOptionRules.cmake's flags for x86-64, as far as they change the IR, with the same
# -fno-strict-aliasing as below for what reads memory, and any name for the namespace, which CMake picks from the version.
[flags.libc]
cxx = true
args = [
  "-O3",
  "-DNDEBUG",
  "-std=c++17",
  "-DLIBC_NAMESPACE=__llvm_libc",
  "-fpie",
  "-ffreestanding",
  "-fno-builtin",
  "-fno-exceptions",
  "-fno-rtti",
  "-fno-lax-vector-conversions",
  "-fno-unwind-tables",
  "-fno-asynchronous-unwind-tables",
  "-fno-omit-frame-pointer",
  "-fno-strict-aliasing",
]
include = ["libc", "libc/include"]

# llvm/CMakeLists.txt's flags for a Release build, as far as they change the IR, and -fno-strict-aliasing, which isn't one
# of them: without it the IR has `tbaa`, which the emitter refuses.
[flags.llvm]
cxx = true
llvm_config = true
args = [
  "-O3",
  "-DNDEBUG",
  "-std=c++17",
  "-fno-exceptions",
  "-fno-rtti",
  "-fvisibility-inlines-hidden",
  "-funwind-tables",
  "-fno-strict-aliasing",
]
include = ["llvm/include"]
local_include = ["tests/llvm/include"]

[[target]]
module = "CrtAshldi3"
proof = "Ashldi3"
source = "compiler-rt/lib/builtins/ashldi3.c"
flags = "compiler_rt"
functions."__ashldi3" = { theorem = "Llvm.ashldi3_correct" }
mutants = [
  { name = "low half shifts one too few", from = '(bits_in_word - b)', to = '(bits_in_word - b + 1)' },
]

