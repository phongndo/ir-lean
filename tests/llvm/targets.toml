[[target]]
module = "CrtUdivmoddi4"
proof = "Udivmoddi4"
source = "compiler-rt/lib/builtins/udivmoddi4.c"
flags = "compiler_rt"
# Upstream doesn't pass this. Without it, the store through `rem` has `tbaa`, which the emitter refuses.
args = ["-fno-strict-aliasing"]
[target.functions."__udivmoddi4"]
theorem = "Llvm.Udivmoddi4.udivmoddi4_correct"
hard = true
loop = true
memory = true
mutants = [
  { name = "last carry dropped", from = "q.all = (q.all << 1) | carry;", to = "q.all = (q.all << 1);" },
  { name = "wrong power-of-2 remainder", from = "*rem = n.s.low & (d.s.low - 1);", to = "*rem = n.s.low & d.s.low;" },
  { name = "wrong high-word remainder", from = "r.s.high = n.s.high % d.s.high;\n        r.s.low = 0;", to = "r.s.high = n.s.high % d.s.high;\n        r.s.low = 1;" },
  { name = "wrong shift count", from = "sr = 1 + n_uword_bits + clzsi(d.s.low) - clzsi(n.s.high);", to = "sr = 2 + n_uword_bits + clzsi(d.s.low) - clzsi(n.s.high);" },
  { name = "one step too few", from = "for (; sr > 0; --sr) {", to = "for (; sr > 1; --sr) {" },
]

