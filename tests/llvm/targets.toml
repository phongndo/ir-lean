[[target]]
module = "LlvmMathExtras"
proof = "MathExtras"
source = "tests/llvm/wrappers/MathExtras.cpp"
wrapper = true
flags = "llvm"
[target.functions."llvm::Hi_32"]
theorem = "Llvm.MathExtras.hi32_correct"
mutants = [
  { name = "wrong shift", file = "llvm/include/llvm/Support/MathExtras.h", from = "return static_cast<uint32_t>(Value >> 32);", to = "return static_cast<uint32_t>(Value >> 31);" },
]
[target.functions."llvm::Lo_32"]
theorem = "Llvm.MathExtras.lo32_correct"
mutants = [
  { name = "wrong half", file = "llvm/include/llvm/Support/MathExtras.h", from = "constexpr uint32_t Lo_32(uint64_t Value) {\n  return static_cast<uint32_t>(Value);", to = "constexpr uint32_t Lo_32(uint64_t Value) {\n  return static_cast<uint32_t>(Value >> 1);" },
]
[target.functions."llvm::Make_64"]
theorem = "Llvm.MathExtras.make64_correct"
mutants = [
  { name = "wrong shift", file = "llvm/include/llvm/Support/MathExtras.h", from = "return ((uint64_t)High << 32) | (uint64_t)Low;", to = "return ((uint64_t)High << 31) | (uint64_t)Low;" },
]
[target.functions."llvm::isMask_64"]
theorem = "Llvm.MathExtras.ismask64_correct"
mutants = [
  { name = "takes zero", file = "llvm/include/llvm/Support/MathExtras.h", from = "constexpr bool isMask_64(uint64_t Value) {\n  return Value && ((Value + 1) & Value) == 0;", to = "constexpr bool isMask_64(uint64_t Value) {\n  return ((Value + 1) & Value) == 0;" },
]
[target.functions."llvm::isShiftedMask_64"]
theorem = "Llvm.MathExtras.isshiftedmask64_correct"
mutants = [
  { name = "needs the lowest bit", file = "llvm/include/llvm/Support/MathExtras.h", from = "return Value && isMask_64((Value - 1) | Value);", to = "return Value && isMask_64(Value);" },
]
[target.functions."llvm::isPowerOf2_64"]
theorem = "Llvm.MathExtras.ispowerof2_64_correct"
mutants = [
  { name = "takes zero", file = "llvm/include/llvm/ADT/bit.h", from = "return (Value != 0) && ((Value & (Value - 1)) == 0);", to = "return ((Value & (Value - 1)) == 0);" },
]
[target.functions."llvm::Log2_64"]
theorem = "Llvm.MathExtras.log2_64_correct"
mutants = [
  { name = "off by one", file = "llvm/include/llvm/Support/MathExtras.h", from = "return 63 - llvm::countl_zero(Value);", to = "return 64 - llvm::countl_zero(Value);" },
]
[target.functions."llvm::Log2_64_Ceil"]
theorem = "Llvm.MathExtras.log2_64_ceil_correct"
mutants = [
  { name = "off by one", file = "llvm/include/llvm/Support/MathExtras.h", from = "return 64 - llvm::countl_zero(Value - 1);", to = "return 64 - llvm::countl_zero(Value);" },
]
